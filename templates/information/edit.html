{% extends "base.html" %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/information.css') }}">{% endblock %}
{% block title %}Edit {{ info.topic }}{% endblock %}
{% block content %}
<section class="wrap">
  <div class="page-header">
    <h1>Edit Information</h1>
    <a class="btn btn-ghost" href="{{ url_for('information.view', info_id=info.id) }}">← Back to {{ info.topic }}</a>
  </div>

  <form class="form" method="POST" action="{{ url_for('information.edit', info_id=info.id) }}">
    <div class="form-group">
      <label for="topic">Topic</label>
      <input 
        type="text" 
        id="topic" 
        name="topic" 
        required 
        value="{{ info.topic }}"
      >
    </div>

    <div class="form-group">
      <label for="information">Information</label>
      <textarea 
        id="information" 
        name="information" 
        required 
        rows="15"
      >{{ info.information }}</textarea>
      <small>Edit the gathered information as needed</small>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a class="btn btn-ghost" href="{{ url_for('information.view', info_id=info.id) }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
